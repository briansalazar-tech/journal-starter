repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this version aligned with Ruff in uv.lock.
    rev: v0.15.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Block commits that contain credentials (API keys, connection strings, tokens).
  # Scans only the staged changes; findings are redacted in the output.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
